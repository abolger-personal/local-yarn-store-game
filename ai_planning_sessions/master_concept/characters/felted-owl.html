<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LYS concept — felted owl</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; transition: filter 120ms linear; }
  canvas.squint { filter: blur(6px); }
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    background: rgba(255,255,255,.82); backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,.08); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; color: #333; max-width: 340px;
  }
  #hud b { color: #111; }
  #hud kbd {
    background: #efefef; border: 1px solid #ddd; border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font-size: 11px; font-family: ui-monospace, monospace;
  }
  #nameplate {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 10;
    font-size: 20px; letter-spacing: .02em; color: #4a4038;
    background: rgba(255,255,255,.7); backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,.07); border-radius: 999px;
    padding: 6px 20px; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="nameplate"></div>
<div id="hud">
  <b>LYS felted owl — concept</b><br />
  Drag to orbit · scroll to zoom<br />
  <kbd>1</kbd> felted &nbsp; <kbd>2</kbd> grey &nbsp; <kbd>3</kbd> silhouette<br />
  <kbd>F</kbd> frame &nbsp; <kbd>D</kbd> 150px test &nbsp; <kbd>B</kbd> squint/blur<br />
  <kbd>R</kbd> randomise &nbsp; <kbd>S</kbd> scarf &nbsp; <kbd>H</kbd> hold skein<br />
  <kbd>P</kbd> cycle pose &nbsp; <kbd>J</kbd> joints &nbsp; <kbd>E</kbd> export<br />
  <span style="opacity:.7">settings auto-save to this browser</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';
import {
  DEFAULT_PARAMS, TONE_MAPPING, POSES, RANDOM_RANGES,
  FEATHER_PRESETS, applyFeatherPreset,
  randomiseInto, createOwl, setViewMode, disposeOwl,
} from './owl.js';

// ---------------------------------------------------------------- parameters
// shape, materials and randomisation all live in owl.js so crowd.html shares them
const P = structuredClone(DEFAULT_PARAMS);
P.showJoints = false;

// randomisation ranges, palettes and name list now live in owl.js

// ---------------------------------------------------------------- renderer
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = TONE_MAPPING[P.toneMapping];
renderer.toneMappingExposure = P.exposure;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8e2d9');

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0.9, 0.75, 1.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.45, 0);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 40;

// sheen needs image-based light to read at all
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------- lighting
const key = new THREE.DirectionalLight('#ffe6c4', 2.6);
key.position.set(2.2, 3.0, 1.8);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 12;
key.shadow.camera.left = -1.5;
key.shadow.camera.right = 1.5;
key.shadow.camera.top = 1.5;
key.shadow.camera.bottom = -1.5;
key.shadow.bias = -0.0012;
key.shadow.radius = 3;
scene.add(key);

scene.add(new THREE.HemisphereLight('#cfe0ff', '#8b7a68', 0.55));

const rim = new THREE.DirectionalLight('#bcd4ff', 1.1);
rim.position.set(-2.0, 1.4, -2.4);
scene.add(rim);

// ---------------------------------------------------------------- ground
// a small pad rather than an infinite plane, so orbiting does not feel like swinging a world
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(2.2, 64),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// felt textures, materials, geometry and the owl builder all live in owl.js

// ---------------------------------------------------------------- build
let owl = null;
let built = null;

function buildOwl() {
  if (built) { scene.remove(built.root); disposeOwl(built); }
  built = createOwl(P);
  owl = built.root;
  scene.add(owl);

  applyView();
  measureFigure();
  updateNameplate();
  rebuildJointHelper();
}

// ---------------------------------------------------------------- joint debug
const JOINT_MAT = new THREE.MeshBasicMaterial({ color: '#ff3b6b', depthTest: false });
const BONE_MAT = new THREE.LineBasicMaterial({ color: '#ff3b6b', depthTest: false });
const JOINT_GEO = new THREE.SphereGeometry(1, 10, 8);
let jointHelper = null;

// draws every Group node and the link to its parent, so a detached joint is obvious
function rebuildJointHelper() {
  if (jointHelper) { scene.remove(jointHelper); jointHelper = null; }
  if (!P.showJoints || !owl) return;

  jointHelper = new THREE.Group();
  jointHelper.renderOrder = 999;
  const world = new THREE.Vector3();
  const parentWorld = new THREE.Vector3();

  owl.updateWorldMatrix(true, true);
  owl.traverse((o) => {
    if (!o.isGroup) return;
    o.getWorldPosition(world);

    const dot = new THREE.Mesh(JOINT_GEO, JOINT_MAT);
    dot.position.copy(world);
    dot.scale.setScalar(0.012);
    jointHelper.add(dot);

    if (o.parent && o.parent !== scene && o.parent.isObject3D && o.parent !== owl) {
      o.parent.getWorldPosition(parentWorld);
      const g = new THREE.BufferGeometry().setFromPoints([world.clone(), parentWorld.clone()]);
      jointHelper.add(new THREE.Line(g, BONE_MAT));
    }
  });

  scene.add(jointHelper);
}

// ---------------------------------------------------------------- view modes
function applyView() {
  if (!owl) return;
  scene.background = new THREE.Color(P.view === 'silhouette' ? '#ffffff' : '#e8e2d9');
  ground.visible = P.view !== 'silhouette';
  setViewMode(owl, P.view);
}

// caches the felted material before any swap, so mode toggling is lossless
function cacheFelt() {
  owl?.traverse((o) => { if (o.isMesh) o.userData.felt ??= o.material; });
}

// ---------------------------------------------------------------- framing
// measured from the built figure, so it stays correct as proportions change
let figureHeight = 1.0;
let figureCenter = new THREE.Vector3(0, 0.45, 0);

function measureFigure() {
  if (!owl) return;
  const box = new THREE.Box3().setFromObject(owl);
  figureHeight = Math.max(box.max.y - box.min.y, 0.01);
  box.getCenter(figureCenter);
}

function frameCharacter() {
  const visible = figureHeight * 1.7;
  const d = visible / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5));
  const dir = new THREE.Vector3(0.55, 0.30, 1).normalize();
  controls.target.copy(figureCenter);
  camera.position.copy(figureCenter).addScaledVector(dir, d);
  controls.update();
}

function distanceTest() {
  const targetPx = 150;
  const visible = figureHeight * innerHeight / targetPx;
  const d = visible / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5));
  const dir = new THREE.Vector3(0.35, 0.22, 1).normalize();
  controls.target.copy(figureCenter);
  camera.position.copy(figureCenter).addScaledVector(dir, d);
  controls.update();
}

// ---------------------------------------------------------------- persistence
// bump the version whenever defaults change, so old saves stop masking them
const STORE_KEY = 'lys.feltedOwl.params.v11';   // v11: featherSize is now a ratio, not world units
const DEFAULTS = structuredClone(P);

function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch {}
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) Object.assign(P, JSON.parse(raw));
  } catch {}
}

function refreshGui() {
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

// remembered so the next save/open dialog starts in the same folder
let lastFileHandle = null;

const FILE_TYPES = [{
  description: 'LYS character params',
  accept: { 'application/json': ['.json'] },
}];

function slugify(s) {
  return (s || 'character').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'character';
}

async function exportJSON() {
  const json = JSON.stringify(P, null, 2);
  const filename = `${slugify(P.name)}.owl.json`;
  navigator.clipboard?.writeText(json).catch(() => {});
  console.log('%c' + (P.name || 'character'), 'font-weight:bold', '\n' + json);

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: FILE_TYPES,
        ...(lastFileHandle ? { startIn: lastFileHandle } : {}),
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      lastFileHandle = handle;
      toast(`saved "${P.name}"`);
      return;
    } catch (err) {
      if (err?.name === 'AbortError') return;   // cancelled, not a failure
      toast('save dialog unavailable, downloading instead');
    }
  }

  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  toast(`exported "${P.name}"`);
}

function loadParams(text, label) {
  try {
    Object.assign(P, JSON.parse(text));
    applyScene(); buildOwl(); refreshGui(); saveLocal();
    toast(`loaded "${P.name}"`);
  } catch {
    toast(`could not parse ${label}`);
  }
}

const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = '.json,application/json';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);

fileInput.addEventListener('change', async () => {
  const file = fileInput.files?.[0];
  if (file) loadParams(await file.text(), file.name);
  fileInput.value = '';
});

async function importJSON() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: FILE_TYPES,
        multiple: false,
        ...(lastFileHandle ? { startIn: lastFileHandle } : {}),
      });
      const file = await handle.getFile();
      lastFileHandle = handle;
      loadParams(await file.text(), file.name);
      return;
    } catch (err) {
      if (err?.name === 'AbortError') return;
    }
  }
  fileInput.click();
}

// tone mapping and exposure live on the renderer, so they need re-applying after a load
function applyScene() {
  renderer.toneMapping = TONE_MAPPING[P.toneMapping] ?? THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = P.exposure;
}

function randomise() {
  randomiseInto(P);
  buildOwl(); refreshGui(); saveLocal();
  toast(`meet ${P.name}`);
}

function updateNameplate() {
  const el = document.getElementById('nameplate');
  if (el) el.textContent = P.name || '';
}

function resetParams() {
  Object.assign(P, structuredClone(DEFAULTS));
  applyScene(); buildOwl(); refreshGui(); saveLocal();
  toast('reset to defaults');
}

let toastTimer;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText =
      'position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:20;' +
      'background:rgba(20,20,20,.88);color:#fff;font:12px ui-sans-serif,system-ui;' +
      'padding:8px 14px;border-radius:8px;pointer-events:none;transition:opacity .2s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.style.opacity = '0'), 1800);
}

// ---------------------------------------------------------------- gui
const gui = new GUI({ title: 'felted owl' });

const gIO = gui.addFolder('character');
gIO.add(P, 'name').name('name').onChange(updateNameplate);
gIO.add({ f: randomise }, 'f').name('randomise  (R)');
gIO.add({ f: exportJSON }, 'f').name('save as...  (E)');
gIO.add({ f: importJSON }, 'f').name('open...');
gIO.add({ f: resetParams }, 'f').name('reset defaults');

const gView = gui.addFolder('view');
gView.add(P, 'view', ['felted', 'grey', 'silhouette']).onChange(applyView);
gView.add({ f: frameCharacter }, 'f').name('frame character  (F)');
gView.add({ dist: distanceTest }, 'dist').name('150px distance test');
gView.add({ squint: () => renderer.domElement.classList.toggle('squint') }, 'squint').name('squint / blur');
gView.add(P, 'exposure', 0.10, 2.0, 0.01).onChange((v) => (renderer.toneMappingExposure = v));
gView.add(P, 'toneMapping', ['AgX', 'ACES', 'None']).onChange((v) => {
  renderer.toneMapping = TONE_MAPPING[v];
});

const gProp = gui.addFolder('proportions');
[
  ['headRadius', 0.10, 0.32], ['headOverlap', 0.0, 0.16], ['neckLength', 0.01, 0.60],
  ['torsoW', 0.12, 0.36], ['torsoH', 0.14, 0.42], ['torsoD', 0.10, 0.34],
  ['legHeight', 0.02, 0.40], ['wingLength', 0.08, 0.40],
].forEach(([k, a, b]) => gProp.add(P, k, a, b, 0.001).onChange(buildOwl));

const gFace = gui.addFolder('face & tufts');
[
  ['eyeRadius', 0.02, 0.14], ['eyeSpread', 0.1, 0.9], ['eyeLift', -0.5, 0.6],
  ['pupilScale', 0.1, 0.9], ['pupilDepth', 0.0, 0.06], ['beakSize', 0.01, 0.18],
  ['tuftSize', 0.01, 0.14], ['tuftSpread', 0.1, 1.1], ['tuftTilt', -1.5, 1.5],].forEach(([k, a, b]) => gFace.add(P, k, a, b, 0.001).onChange(buildOwl));
gFace.close();

const gMat = gui.addFolder('body material');
gMat.addColor(P, 'bodyColor').onChange(buildOwl);
gMat.add(P, 'sheen', 0, 1, 0.01).onChange(buildOwl);
gMat.add(P, 'sheenRoughness', 0, 1, 0.01).onChange(buildOwl);
gMat.addColor(P, 'sheenTint').onChange(buildOwl);
gMat.add(P, 'roughness', 0, 1, 0.01).onChange(buildOwl);

const gFeather = gui.addFolder('feathers');
gFeather.add(P, 'feathers').name('enabled').onChange(buildOwl);
gFeather.addColor(P, 'featherColor').onChange(buildOwl);
gFeather.add(P, 'featherHead').name('on head').onChange(buildOwl);
gFeather.add(P, 'featherWings').name('on wings').onChange(buildOwl);
gFeather.add(P, 'featherPreset', 0, FEATHER_PRESETS.length - 1, 1)
  .name('preset').onChange((v) => { applyFeatherPreset(P, v); buildOwl(); gui.controllersRecursive().forEach((c) => c.updateDisplay()); });
gFeather.add(P, 'featherRows', 1, 8, 1).onChange(buildOwl);
gFeather.add(P, 'featherPerRow', 3, 20, 1).onChange(buildOwl);
gFeather.add(P, 'featherSize', 0.08, 0.55, 0.005).name('size (rel)').onChange(buildOwl);
gFeather.add(P, 'featherProud', 0.1, 1.6, 0.01).name('stand off').onChange(buildOwl);
gFeather.add(P, 'featherFlat', 0, 1.2, 0.01).name('sink in').onChange(buildOwl);
gFeather.add(P, 'featherTop', 0, 1, 0.01).name('torso top').onChange(buildOwl);
gFeather.add(P, 'featherBottom', 0, 1, 0.01).name('torso bottom').onChange(buildOwl);
gFeather.add(P, 'featherHeadScale', 0.2, 1.4, 0.01).name('head scale').onChange(buildOwl);
gFeather.add(P, 'featherWingScale', 0.2, 1.4, 0.01).name('wing scale').onChange(buildOwl);
gFeather.add(P, 'featherFaceGap', 0, 3.2, 0.01).name('face gap').onChange(buildOwl);
gFeather.add(P, 'featherStagger').name('shingle stagger').onChange(buildOwl);

const gEye = gui.addFolder('eyes (glassy)');
gEye.addColor(P, 'eyeColor').onChange(buildOwl);
gEye.addColor(P, 'pupilColor').onChange(buildOwl);
gEye.add(P, 'eyeSheen', 0, 1, 0.01).onChange(buildOwl);
gEye.add(P, 'eyeSheenRough', 0, 1, 0.01).onChange(buildOwl);
gEye.add(P, 'eyeRough', 0, 1, 0.01).onChange(buildOwl);
gEye.add(P, 'eyeClearcoat', 0, 1, 0.01).onChange(buildOwl);
gEye.close();

const gGarment = gui.addFolder('garment');
gGarment.add(P, 'scarf').onChange(buildOwl);
gGarment.addColor(P, 'scarfColor').onChange(buildOwl);

const POSES_LOCAL_REMOVED = true;   // POSES now imported from owl.js

const gRig = gui.addFolder('rig & pose');
gRig.add({ pose: 'rest' }, 'pose', Object.keys(POSES)).name('preset').onChange((name) => {
  Object.assign(P, POSES[name]);
  buildOwl(); refreshGui(); saveLocal();
});
[
  ['armSwing', -1.6, 1.6], ['armOut', -0.4, 1.2], ['elbowBend', -0.2, 2.4],
  ['legSwing', -1.0, 1.0], ['kneeBend', -1.4, 0.4],
  ['hipInset', 0.0, 0.14], ['legSpread', 0.02, 0.20], ['limbThick', 0.012, 0.070],
  ['upperArmLen', 0.03, 0.20], ['forearmLen', 0.03, 0.20],
  ['wingWidth', 0.06, 0.45], ['wingDepth', 0.10, 0.70],
].forEach(([k, a, b]) => gRig.add(P, k, a, b, 0.001).onChange(buildOwl));
gRig.add(P, 'holdItem').name('hold a skein').onChange(buildOwl);
gRig.addColor(P, 'heldColor').onChange(buildOwl);
gRig.add(P, 'showJoints').name('show joints  (J)').onChange(rebuildJointHelper);

// ---------------------------------------------------------------- keys
addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement) return;   // never hijack the name field
  const k = e.key.toLowerCase();
  if (k === '1') { P.view = 'felted'; applyView(); refreshGui(); }
  if (k === '2') { P.view = 'grey'; applyView(); refreshGui(); }
  if (k === '3') { P.view = 'silhouette'; applyView(); refreshGui(); }
  if (k === 'd') distanceTest();
  if (k === 'f') frameCharacter();
  if (k === 'r') randomise();
  if (k === 'j') { P.showJoints = !P.showJoints; rebuildJointHelper(); refreshGui(); }
  if (k === 'b') renderer.domElement.classList.toggle('squint');
  if (k === 's') { P.scarf = !P.scarf; buildOwl(); refreshGui(); }
  if (k === 'h') { P.holdItem = !P.holdItem; buildOwl(); refreshGui(); }
  if (k === 'p') {
    const names = Object.keys(POSES);
    poseIndex = (poseIndex + 1) % names.length;
    Object.assign(P, POSES[names[poseIndex]]);
    buildOwl(); refreshGui(); saveLocal();
    toast('pose: ' + names[poseIndex]);
  }
  if (k === 'e') exportJSON();
});

let poseIndex = 0;

// every gui change persists, so a reload never loses tuning work
gui.onFinishChange(saveLocal);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- go
loadLocal();
refreshGui();
applyScene();
buildOwl();
cacheFelt();
frameCharacter();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
