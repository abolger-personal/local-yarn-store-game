<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LYS concept — crowd</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; transition: filter 120ms linear; }
  canvas.squint { filter: blur(6px); }
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    background: rgba(255,255,255,.82); backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,.08); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; color: #333; max-width: 380px;
  }
  #hud b { color: #111; }
  #hud kbd {
    background: #efefef; border: 1px solid #ddd; border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font-size: 11px; font-family: ui-monospace, monospace;
  }
  #roster {
    position: fixed; right: 12px; bottom: 12px; z-index: 10;
    background: rgba(255,255,255,.82); backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,.08); border-radius: 10px;
    padding: 8px 12px; font-size: 11px; line-height: 1.6; color: #444;
    max-height: 40vh; overflow: auto; max-width: 200px;
  }
  #roster i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 20;
    background: rgba(20,20,20,.88); color: #fff; font-size: 12px;
    padding: 8px 14px; border-radius: 8px; pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  #perf {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    background: rgba(20,20,20,.82); color: #e8e8e8;
    font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    border-radius: 8px; padding: 9px 12px; min-width: 190px; pointer-events: none;
  }
  #perf b { color: #fff; font-weight: 600; }
  #perf .warn { color: #ffb454; }
  #perf .bad { color: #ff6b6b; }
  #perf .ok { color: #8fd67a; }
  #selfies {
    position: fixed; inset: 0; z-index: 30; overflow: auto;
    background: rgba(30,26,24,.92); padding: 48px 16px 16px;
  }
  #selfies[hidden] { display: none; }
  #selfies .close {
    position: fixed; right: 16px; top: 12px; font-size: 13px; padding: 4px 10px; border-radius: 6px;
    border: 0; background: #f2e3c6; cursor: pointer;
  }
  #selfies .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  #selfies figure { margin: 0; background: #fbf7ef; padding: 8px 8px 6px; border-radius: 4px; }
  #selfies img { display: block; width: 100%; height: auto; }
  #selfies figcaption { font-size: 11px; line-height: 1.45; color: #444; padding-top: 5px; }
  #selfies figcaption.fails { color: #a3271d; }
</style>
</head>
<body>
<div id="app"></div>
<div id="perf"></div>
<div id="toast"></div>
<div id="hud">
  <b>LYS crowd</b> — does the randomiser make a cast, or a zoo?<br />
  Drag to orbit · scroll to zoom<br />
  <kbd>1</kbd> felted &nbsp; <kbd>2</kbd> grey &nbsp; <kbd>3</kbd> silhouette<br />
  <kbd>R</kbd> reroll crowd &nbsp; <kbd>F</kbd> frame &nbsp; <kbd>D</kbd> 150px test<br />
  <kbd>B</kbd> squint/blur &nbsp; <kbd>Space</kbd> pause poses<br />
  <kbd>P</kbd> selfie every character &nbsp; <kbd>Esc</kbd> close
</div>
<div id="roster"></div>
<div id="selfies" hidden><button class="close" type="button">close  (Esc)</button><div class="grid"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
  }
}
</script>

<script type="module" src="./crowd.js"></script>
</body>
</html>
