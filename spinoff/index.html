<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Donut fighters</title>
<style>
  /* no pull-to-refresh: reloading this page drops every room */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f6e7d4; touch-action: none; }
  #tap { width: 100%; height: 100%; border: 0; background: none; font-size: 30vmin; cursor: pointer; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
<script type="importmap">
{ "imports": { "trystero": "https://esm.sh/trystero@0.26.0" } }
</script>
</head>
<body>
<!-- The game runs in the frame, so going from screen to screen inside it never leaves fullscreen, and the rooms
     (rooms.js) live here, so going from screen to screen never drops the other tablets. -->
<button id="tap" aria-label="tap to play">🍩👆</button>
<script>
  const q = new URLSearchParams(location.search);
  try {
    sessionStorage.setItem('donut.debug', q.get('debug') ?? '0');
    for (const k of ['tone', 'exposure']) {
      if (q.has(k)) sessionStorage.setItem(`donut.${k}`, q.get(k));
      else sessionStorage.removeItem(`donut.${k}`);
    }
  } catch { /* private mode */ }
  document.getElementById('tap').addEventListener('click', (e) => {
    document.documentElement.requestFullscreen?.().catch(() => {});
    window.donutRooms = import('./rooms.js');
    // a game page opened by itself comes back here as ?open=, and opens once tapped; only the game's own pages
    const open = /^(choose|lobby|play)\.html(\?[^"<>]*)?$/.test(q.get('open') ?? '') ? q.get('open') : 'choose.html';
    e.currentTarget.outerHTML = `<iframe src="${open}" allow="fullscreen; screen-wake-lock"></iframe>`;
  });
</script>
</body>
</html>
