<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Donut fighters</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6e7d4; }
  #tap { width: 100%; height: 100%; border: 0; background: none; font-size: 30vmin; cursor: pointer; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- The game runs in the frame, so going from screen to screen inside it never leaves fullscreen. -->
<button id="tap" aria-label="tap to play">🍩👆</button>
<script>
  document.getElementById('tap').addEventListener('click', (e) => {
    document.documentElement.requestFullscreen?.().catch(() => {});
    e.currentTarget.outerHTML = '<iframe src="choose.html" allow="fullscreen; screen-wake-lock"></iframe>';
  });
</script>
</body>
</html>
