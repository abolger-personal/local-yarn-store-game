<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Donut fighters — play</title>
<script>if (top === self) location.replace(`./?open=${encodeURIComponent(location.pathname.split('/').pop() + location.search)}`);</script>
<link rel="stylesheet" href="spinoff.css" />
</head>
<body class="lobby">
<header class="bar">
  <div id="code" class="code" aria-label="room code"></div>
</header>
<main id="stage"></main>
<footer>
  <div id="start" class="start">
    <button id="edit" aria-label="change my fighter"><span class="emoji">✏️</span></button>
    <button id="host" aria-label="start a game"><span class="emoji">🏠</span></button>
    <button id="join" aria-label="join a game"><span class="emoji">🔑</span></button>
    <button id="play" aria-label="play by myself: pick where"><span class="emoji">👍</span></button>
  </div>
  <div id="keypad" class="keypad hidden" aria-label="type the code"></div>
  <div id="inroom" class="bar hidden">
    <button id="exit" aria-label="wave bye, leave this room"><span class="emoji">👋</span></button>
    <div id="playing" class="wait hidden" aria-label="a game is on: you play the next round"><span class="emoji">⏳</span></div>
    <button id="go" class="hidden" aria-label="pick where everyone here plays"><span class="emoji">👍</span></button>
  </div>
  <div id="picker" class="bar picker hidden">
    <div id="stage-list" class="stages" aria-label="pick a stage"></div>
    <div id="dial" class="keypad dial hidden" aria-label="pick a level"></div>
    <div class="menu">
      <button id="pick-bye" aria-label="wave bye, back to the room"><span class="emoji">👋</span></button>
      <button id="pick-go" class="hidden" aria-label="play this level"><span class="emoji">▶️</span></button>
    </div>
  </div>
</footer>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/",
    "trystero": "https://esm.sh/trystero@0.26.0"
  }
}
</script>
<script type="module" src="lobby.js"></script>
</body>
</html>
