<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Donut fighters — fight</title>
<link rel="stylesheet" href="spinoff.css" />
</head>
<body class="play">
<main id="stage"></main>
<header class="hud">
  <button id="leave" aria-label="wave bye, back to the lobby"><span class="emoji">👋</span></button>
  <div class="count heroes" aria-label="donuts on our shelf"><span class="emoji">🍩</span><span id="count-heroes"></span></div>
  <div id="clock" class="clock" aria-label="seconds left"></div>
  <div class="count badGuys" aria-label="donuts on the bad guys' shelf"><span id="count-badGuys"></span><span class="emoji">🍩</span></div>
</header>
<div class="moves">
  <button id="punch" aria-label="punch"><span class="emoji">🥊</span></button>
  <button id="kick" aria-label="kick"><span class="emoji">🦶</span></button>
</div>
<div id="end" class="end" hidden>
  <div class="card">
    <div class="side heroes"><span class="crown emoji">👑</span><div id="end-pics-heroes" class="pics"></div><div id="end-count-heroes" class="big"></div></div>
    <div class="side badGuys"><span class="crown emoji">👑</span><div id="end-pics-badGuys" class="pics"></div><div id="end-count-badGuys" class="big"></div></div>
    <div class="again">
      <button id="again" aria-label="play again"><span class="emoji">▶️</span></button>
      <button id="bye" aria-label="wave bye, back to the lobby"><span class="emoji">👋</span></button>
    </div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
  }
}
</script>
<script type="module" src="play.js"></script>
</body>
</html>
