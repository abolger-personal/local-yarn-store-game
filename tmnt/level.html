<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Turtles in Twine — the playground</title>
<link rel="stylesheet" href="../spinoff/spinoff.css" />
</head>
<body class="play">
<main id="stage"></main>
<!-- REUSE-SPEC.md §Level 1, Building it, step 2: one hero walking a generated level; no bad guys, no clock -->
<header class="hud">
  <div class="corner">
    <button id="leave" aria-label="wave bye, back to the lobby"><span class="emoji">👋</span></button>
  </div>
</header>
<dl id="keys" class="keys" hidden aria-label="keyboard keys">
  <dt><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd></dt><dd>walk</dd>
  <dt><kbd>space</kbd></dt><dd>jump</dd>
  <dt><kbd>Z</kbd></dt><dd><span class="emoji">🥊</span></dd>
  <dt><kbd>X</kbd></dt><dd><span class="emoji">🦶</span></dd>
</dl>
<div class="moves">
  <button id="punch" aria-label="punch"><span class="emoji">🥊</span></button>
  <button id="kick" aria-label="kick"><span class="emoji">🦶</span></button>
  <button id="drop" class="hidden" aria-label="put the block down"><span class="emoji">⬇️</span></button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
  }
}
</script>
<script type="module" src="level.js"></script>
</body>
</html>
