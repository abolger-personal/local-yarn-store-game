<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080">
  <title>Level 1 pieces: the Capuano playground, side views</title>
  <!-- REUSE-SPEC.md §Level 1, the pieces: side views as seen from Glen St (the camera), left = north, the way the level
       scrolls. Feet, 18 px to the foot, up is negative inside each panel. Drafted 2026-11-10 from the designer's Street
       View screenshots; dashed pink = a guess, check it. Every piece has an id. -->
  <style>
    .ink { stroke: #141414; stroke-width: 0.11; stroke-linejoin: round; }
    .guess { fill: none; stroke: #e0408a; stroke-width: 0.11; stroke-dasharray: 0.35 0.25; }
    .ground { stroke: #8a7f74; stroke-width: 0.11; }
    .title { font: 700 18px sans-serif; fill: #141414; }
    .lbl { font: 0.72px sans-serif; fill: #141414; }
    .q { font: 700 0.72px sans-serif; fill: #e0408a; }
    .post { fill: #2f3db8; }
    .rail { fill: #f0b648; }
    .deck { fill: #3a3a3a; }
    .roof { fill: #2e6b58; }
  </style>
  <defs>
    <!-- a kid-sized hero for scale: 3 ft 10 in -->
    <g id="kid">
      <rect class="ink" x="-0.7" y="-2.9" width="1.4" height="2.2" rx="0.6" fill="#1fd18b"/>
      <circle class="ink" cx="0" cy="-3.25" r="0.6" fill="#1fd18b"/>
      <rect class="ink" x="-0.55" y="-0.8" width="0.4" height="0.8" fill="#1fd18b"/>
      <rect class="ink" x="0.15" y="-0.8" width="0.4" height="0.8" fill="#1fd18b"/>
    </g>
  </defs>
  <rect width="1180" height="1080" fill="#fbf7f0"/>

  <!-- A: the near structure, two towers and a clatter bridge, all along Glen St -->
  <text class="title" x="20" y="30">A · the near structure (Glen St side): dome, towers, steps, bridge, grid, top deck, slides</text>
  <g id="structure-a" transform="translate(40 335) scale(18)">
    <path class="ground" d="M-2 0 H62"/>
    <g id="a-wavy-slide"><path d="M8 -7 C5.5 -7 5.5 -3.5 3 -3.5 S1 -0.6 -1 -0.6" fill="none" stroke="#141414" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8 -7 C5.5 -7 5.5 -3.5 3 -3.5 S1 -0.6 -1 -0.6" fill="none" stroke="#2f5d3a" stroke-width="1.2" stroke-linecap="round"/></g>
    <text class="lbl" x="-1.5" y="-9.2">green wavy slide (down only)</text>
    <g id="a-climbing-dome"><path class="ink" d="M8.1 0 C8.1 -9.3 16.1 -9.3 16.1 0 Z" fill="#9aa0a6"/>
      <path d="M11 0 C11 -1.9 13.2 -1.9 13.2 0 Z" fill="#2a2a2a"/>
      <g fill="#f0b648" class="ink"><circle cx="8.7" cy="-1.6" r="0.28"/><circle cx="9.1" cy="-3.3" r="0.28"/><circle cx="10" cy="-4.8" r="0.28"/><circle cx="14.3" cy="-4.8" r="0.28"/><circle cx="15.2" cy="-3.3" r="0.28"/><circle cx="15.6" cy="-1.6" r="0.28"/></g></g>
    <text class="lbl" x="7" y="1.3">climbing dome, joined to the deck:</text>
    <text class="lbl" x="7" y="2.1">climb up onto it; under it, the bear cave</text>
    <text class="q" x="7" y="2.9">its face is on the far side: turned to us</text>
    <g id="a-tower-high">
      <rect class="ink post" x="8" y="-12" width="0.5" height="12"/>
      <rect class="ink post" x="13.6" y="-12" width="0.5" height="12"/>
      <rect class="ink deck" x="8" y="-7.3" width="6.1" height="0.4"/>
      <rect class="ink rail" x="8.5" y="-10.3" width="5.1" height="3"/>
      <path class="ink roof" d="M7.4 -12 L11.05 -15.2 L14.7 -12 Z"/>
    </g>
    <text class="lbl" x="7.4" y="-15.6">tower, deck 7 ft (check), roof</text>
    <g id="a-deck-low">
      <rect class="ink post" x="19.6" y="-9.5" width="0.5" height="9.5"/>
      <rect class="ink deck" x="14.1" y="-6.4" width="6" height="0.4"/>
      <rect class="ink rail" x="14.6" y="-9.4" width="5" height="3"/>
    </g>
    <text class="lbl" x="14.2" y="-9.9">deck 6 ft (check)</text>
    <g id="a-squiggle-climber">
      <path d="M17.1 0 V-6.1" stroke="#141414" stroke-width="0.4" stroke-linecap="round"/>
      <path d="M17.1 0 V-6.1" stroke="#f0b648" stroke-width="0.26" stroke-linecap="round"/>
      <path d="M16.2 -0.5 H18 A0.6 0.6 0 0 0 18 -1.7 H16.2 A0.6 0.6 0 0 1 16.2 -2.9 H18 A0.6 0.6 0 0 0 18 -4.1 H16.2 A0.6 0.6 0 0 1 16.2 -5.3 H18 A0.35 0.35 0 0 0 18 -6" fill="none" stroke="#141414" stroke-width="0.34" stroke-linecap="round"/>
      <path d="M16.2 -0.5 H18 A0.6 0.6 0 0 0 18 -1.7 H16.2 A0.6 0.6 0 0 1 16.2 -2.9 H18 A0.6 0.6 0 0 0 18 -4.1 H16.2 A0.6 0.6 0 0 1 16.2 -5.3 H18 A0.35 0.35 0 0 0 18 -6" fill="none" stroke="#f0b648" stroke-width="0.2" stroke-linecap="round"/>
    </g>
    <text class="lbl" x="20.5" y="2.3">squiggle climber</text>
    <g id="a-fire-pole"><path d="M20.8 0 V-9.9 A0.6 0.6 0 0 0 19.6 -9.9" fill="none" stroke="#141414" stroke-width="0.45" stroke-linecap="round"/>
      <path d="M20.8 0 V-9.9 A0.6 0.6 0 0 0 19.6 -9.9" fill="none" stroke="#f0d000" stroke-width="0.28" stroke-linecap="round"/></g>
    <text class="lbl" x="21.2" y="-10.4">yellow fire pole: off the 6 ft deck, by the steps</text>
    <g id="a-steps">
      <path class="ink" fill="#3a3a3a" d="M20.1 -6 H21.6 V-5.5 H23.1 V-5 H24.6 V-4.5 H26 V-4 L26 -3.6 L20.1 -5.6 Z"/>
      <path d="M20.3 -9 L26 -7" stroke="#f0b648" stroke-width="0.25" stroke-linecap="round"/>
    </g>
    <text class="lbl" x="19.6" y="-2.6">steps down to the bridge</text>
    <g id="a-bridge">
      <path class="ink deck" d="M26 -4.4 Q32 -3.4 38 -4.4 V-4 Q32 -3 26 -4 Z"/>
      <path d="M26 -6.6 Q32 -5.6 38 -6.6 M26 -7.4 Q32 -6.4 38 -7.4" fill="none" stroke="#f0b648" stroke-width="0.18"/>
      <rect class="ink post" x="25.8" y="-8" width="0.5" height="8"/>
    </g>
    <text class="lbl" x="28.5" y="-8">clatter bridge (wobbles), 4 ft</text>
    <g id="a-tower-b">
      <rect class="ink post" x="38" y="-10" width="0.5" height="10"/>
      <rect class="ink post" x="43.6" y="-10" width="0.5" height="10"/>
      <rect class="ink deck" x="38" y="-4.4" width="6.1" height="0.4"/>
      <rect class="ink" fill="#2f7a50" x="38.6" y="-7.4" width="4.9" height="3"/>
      <g fill="#3f9a62" class="ink"><rect x="39.2" y="-6.9" width="1" height="2"/><rect x="40.55" y="-6.9" width="1" height="2"/><rect x="41.9" y="-6.9" width="1" height="2"/></g>
      <path class="ink roof" d="M37.4 -10 L41.05 -13.2 L44.7 -10 Z"/>
    </g>
    <text class="lbl" x="37.4" y="-13.6">tower, deck 4 ft, tic-tac-toe panel</text>
    <g id="a-climbing-grid">
      <path d="M44.4 -4 V-7.9 M47.6 -4 V-7.9" stroke="#141414" stroke-width="0.42" stroke-linecap="round"/>
      <path d="M44.4 -4 V-7.9 M47.6 -4 V-7.9" stroke="#2f3db8" stroke-width="0.28" stroke-linecap="round"/>
      <path d="M44.4 -4.7 H47.6 M44.4 -5.4 H47.6 M44.4 -6.1 H47.6 M44.4 -6.8 H47.6 M44.4 -7.5 H47.6 M45.2 -4 V-7.9 M46 -4 V-7.9 M46.8 -4 V-7.9" stroke="#f0b648" stroke-width="0.16"/>
    </g>
    <text class="lbl" x="43.4" y="-8.4">climbing grid</text>
    <g transform="translate(3.6 0)">
    <g id="a-stairs-up">
        <path class="ink" fill="#3a3a3a" d="M44.1 -4 H44.6 V-4.7 H45.1 V-5.4 H45.6 V-6.1 H46.1 V-6.8 H46.6 V-7.5 L46.6 -6.2 L44.1 -2.9 Z"/>
        <path d="M44.2 -7 L46.6 -10.3" stroke="#f0b648" stroke-width="0.25" stroke-linecap="round"/>
      </g>
      <g id="a-deck-top">
        <rect class="ink post" x="46.6" y="-10.5" width="0.5" height="10.5"/>
        <rect class="ink post" x="49.4" y="-10.5" width="0.5" height="10.5"/>
        <rect class="ink deck" x="46.6" y="-7.9" width="3.3" height="0.4"/>
        <rect class="ink rail" x="47.1" y="-10.5" width="2.3" height="2.6"/>
      </g>
      <text class="lbl" x="41" y="-11.6">stairs up to a top deck, 7.5 ft</text>
      <g id="a-curly-slide"><path d="M49.9 -7.5 C54 -7.5 55 -5.4 53 -4.4 C51 -3.4 51.5 -2.2 53.5 -1.8 C55.5 -1.4 55.3 -0.5 56.5 -0.5" fill="none" stroke="#141414" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M49.9 -7.5 C54 -7.5 55 -5.4 53 -4.4 C51 -3.4 51.5 -2.2 53.5 -1.8 C55.5 -1.4 55.3 -0.5 56.5 -0.5" fill="none" stroke="#2a7f6f" stroke-width="1.2" stroke-linecap="round"/></g>
      <text class="lbl" x="51.5" y="-10.2">teal curly slide,</text>
      <text class="lbl" x="51.5" y="-9.4">two decks high</text>
    </g>
    <g id="a-step-downs">
      <rect class="ink deck" x="44.5" y="-3" width="2" height="0.4"/>
      <rect class="ink deck" x="47" y="-2" width="2" height="0.4"/>
      <rect class="ink deck" x="49.5" y="-1" width="2" height="0.4"/>
      <path d="M52 0 V-3 A0.6 0.6 0 0 1 53.2 -3 V0" fill="none" stroke="#f0b648" stroke-width="0.25"/>
    </g>
    <text class="lbl" x="47" y="1.2">step-downs 3, 2, 1 ft</text>
    <use href="#kid" x="31" y="0"/>
    <text class="lbl" x="29.6" y="1.2">a hero, 3 ft 10</text>
  </g>

  <!-- B: the other structure, behind A; drawn from the designer's Street View from Palmer Ave (Nov 2020), about 90°
       round from the Glen St views, then unwrapped like A -->
  <text class="title" x="20" y="405">B · the other structure (behind A, mostly scenery): its two yellow bars come out of it</text>
  <g id="structure-b" transform="translate(40 722) scale(18)">
    <path class="ground" d="M-2 0 H52"/>
    <g id="b-spiral"><path d="M5 -4 C1 -4 0.5 -2.6 2.2 -2 C3.8 -1.4 2.5 -0.5 -1 -0.5" fill="none" stroke="#141414" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5 -4 C1 -4 0.5 -2.6 2.2 -2 C3.8 -1.4 2.5 -0.5 -1 -0.5" fill="none" stroke="#6b55d9" stroke-width="1.2" stroke-linecap="round"/></g>
    <text class="lbl" x="-1.5" y="-4.9">violet curly slide</text>
    <g id="b-spinner-panel">
      <rect class="ink post" x="4.6" y="-8" width="0.5" height="8"/>
      <rect class="ink post" x="8.1" y="-8" width="0.5" height="8"/>
      <circle class="ink" cx="6.6" cy="-6" r="1.5" fill="#fbfbf6"/>
      <circle cx="6.1" cy="-6.4" r="0.35" fill="#2f3db8"/><circle cx="7.1" cy="-6.3" r="0.4" fill="#c8202c"/><circle cx="6.5" cy="-5.4" r="0.35" fill="#f0b648"/>
    </g>
    <text class="lbl" x="4" y="-8.6">spinner panel</text>
    <g id="b-deck-long">
      <rect class="ink deck" x="4.6" y="-4.4" width="22.6" height="0.4"/>
      <rect class="ink rail" x="8.6" y="-7.4" width="18" height="3"/>
      <rect class="ink post" x="14" y="-8" width="0.5" height="8"/>
      <rect class="ink post" x="20" y="-8" width="0.5" height="8"/>
    </g>
    <text class="lbl" x="9.5" y="-3">long deck, 4 ft (check)</text>
    <g id="b-arches" fill="none" stroke-linecap="round">
      <path d="M10 -7.4 V-9 A2 2 0 0 1 14 -9 V-7.4 M15.5 -7.4 V-9 A2 2 0 0 1 19.5 -9 V-7.4" stroke="#141414" stroke-width="0.5"/>
      <path d="M10 -7.4 V-9 A2 2 0 0 1 14 -9 V-7.4 M15.5 -7.4 V-9 A2 2 0 0 1 19.5 -9 V-7.4" stroke="#2f3db8" stroke-width="0.32"/>
    </g>
    <text class="lbl" x="10.5" y="-11.5">blue arches over the deck</text>
    <g id="b-bars" transform="translate(23.5 0)">
      <path d="M15.6 0 V-3.1 M17.4 0 V-3.1 M19.6 0 V-3.7 M21.4 0 V-3.7" stroke="#141414" stroke-width="0.42" stroke-linecap="round"/>
      <path d="M15.6 0 V-3.1 M17.4 0 V-3.1 M19.6 0 V-3.7 M21.4 0 V-3.7" stroke="#f0b648" stroke-width="0.28" stroke-linecap="round"/>
      <g fill="#f0b648" class="ink"><circle cx="16.5" cy="-3.1" r="0.3"/><circle cx="20.5" cy="-3.7" r="0.3"/></g>
      <circle cx="16.5" cy="-3.1" r="1.5" class="guess"/>
      <circle cx="20.5" cy="-3.7" r="1.5" class="guess"/>
    </g>
    <text class="lbl" x="35" y="-6.4">two yellow bars side by side, waist to chest high:</text>
    <text class="lbl" x="35" y="-5.6">grab, swing round, fly off (in the kit)</text>
    <g id="b-stairs">
      <path class="ink" fill="#3a3a3a" d="M21 0 V-0.8 H21.7 V-1.6 H22.4 V-2.4 H23.1 V-3.2 H23.8 V-4 H24.5 V-3.6 L21.6 0 Z"/>
    </g>
    <text class="lbl" x="22.6" y="2.1">stairs</text>
    <g id="b-tower">
      <rect class="ink post" x="27" y="-11" width="0.5" height="11"/>
      <rect class="ink post" x="32.6" y="-11" width="0.5" height="11"/>
      <rect class="ink deck" x="27" y="-5.4" width="6.1" height="0.4"/>
      <rect class="ink" fill="#6b55d9" x="27.5" y="-8.4" width="5.1" height="3"/>
      <path class="ink roof" d="M26.4 -11 L30.05 -14 L33.7 -11 Z"/>
    </g>
    <text class="lbl" x="26.4" y="-14.5">tower, deck 5 ft (check), violet panel</text>
    <g id="b-straight-slide"><path d="M33.1 -5 C35 -5 35.5 -1 38.5 -0.5" fill="none" stroke="#141414" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M33.1 -5 C35 -5 35.5 -1 38.5 -0.5" fill="none" stroke="#6b55d9" stroke-width="1.2" stroke-linecap="round"/></g>
    <text class="lbl" x="33.4" y="-7.6">violet slide</text>
    <text class="q" x="-1" y="-13">From Palmer Ave, Nov 2020 (older paint);</text>
    <text class="q" x="-1" y="-12.2">heights guessed. The violet spiral seen</text>
    <text class="q" x="-1" y="-11.4">from Glen St: this curly one?</text>
    <use href="#kid" x="48.5" y="0"/>
  </g>

  <!-- C: the swings, blue hoops; D: the street layer in front -->
  <text class="title" x="20" y="785">C · arch swings (a row of four by Palmer Ave)       D · in front, on Glen St</text>
  <g id="swings" transform="translate(40 1045) scale(18)">
    <path class="ground" d="M-2 0 H33"/>
    <g fill="none" stroke-linecap="round">
      <path d="M0 0 V-6 A3.5 3.5 0 0 1 7 -6 V0 M7 0 V-6 A3.5 3.5 0 0 1 14 -6 V0" stroke="#141414" stroke-width="0.7"/>
      <path d="M0 0 V-6 A3.5 3.5 0 0 1 7 -6 V0 M7 0 V-6 A3.5 3.5 0 0 1 14 -6 V0" stroke="#2f3db8" stroke-width="0.45"/>
      <path d="M2.6 -9.3 V-2 M4.4 -9.3 V-2 M9.6 -9.3 V-2 M11.4 -9.3 V-2" stroke="#555" stroke-width="0.08"/>
    </g>
    <rect class="ink" x="2.3" y="-2.1" width="2.4" height="0.35" fill="#141414"/>
    <path class="ink" d="M9.2 -2.4 H11.8 V-1.6 C11.8 -1 9.2 -1 9.2 -1.6 Z" fill="#2f7a50"/>
    <text class="lbl" x="0" y="-10.2">hoops 9.5 ft, seats 2 ft up; ride, launch, 360° (not real)</text>
    <text class="lbl" x="8.6" y="1.2">a bucket seat</text>
    <use href="#kid" x="16" y="0"/>
  </g>
  <g id="street" transform="translate(470 1045) scale(18)">
    <path class="ground" d="M-1 0 H31"/>
    <g id="d-fence"><path d="M0 0 V-4 H18 V0" fill="none" stroke="#141414" stroke-width="0.12"/>
      <path d="M0 -2 H18 M3 -4 V0 M6 -4 V0 M9 -4 V0 M12 -4 V0 M15 -4 V0" stroke="#141414" stroke-width="0.04"/></g>
    <text class="lbl" x="0" y="1.2">black chain-link fence, 4 ft</text>
    <g id="d-bench"><rect class="ink" x="13" y="-1.6" width="4" height="0.3" fill="#1f2a24"/><rect class="ink" x="13" y="-3" width="4" height="0.9" fill="#1f2a24"/></g>
    <g id="d-telephone-pole"><rect class="ink" x="22" y="-14" width="0.9" height="14" fill="#8a5a3a"/>
      <rect class="ink" x="21.3" y="-11" width="2.3" height="3" fill="#fff"/>
      <text class="lbl" x="21.5" y="-9.9" style="font-size:0.5px">ONE WAY</text>
      <path d="M21.7 -9 H23.3 M23.3 -9 L22.8 -9.4 M23.3 -9 L22.8 -8.6" stroke="#141414" stroke-width="0.14"/>
      <rect class="ink" x="21.6" y="-7.4" width="1.7" height="2" fill="#fff"/><rect x="21.75" y="-7.2" width="1.4" height="0.5" fill="#c8202c"/></g>
    <text class="lbl" x="23.9" y="-9.5">→ the way the level goes</text>
    <text class="lbl" x="23.9" y="-6.4">NO PARKING</text>
    <use href="#kid" x="8" y="0"/>
  </g>
</svg>
