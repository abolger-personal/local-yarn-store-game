<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Turtles in Twine — play</title>
<!-- every page runs inside the tap page (index.html), which keeps fullscreen and the rooms -->
<script>if (top === self) location.replace(`./?open=${encodeURIComponent(location.pathname.split('/').pop() + location.search)}`);</script>
<link rel="stylesheet" href="../spinoff/spinoff.css" />
</head>
<body class="lobby">
<!-- the lobby's page is three rows (spinoff.css): a bar on top, the room, the buttons; the bar is empty till there are rooms -->
<header class="bar"></header>
<main id="stage"></main>
<!-- REUSE-SPEC.md §Level 1, Building it: the donut fighters' lobby, single player only for now: ✏️ your hero, 👍 pick where -->
<footer>
  <div id="start" class="start">
    <button id="edit" aria-label="change my hero"><span class="emoji">✏️</span></button>
    <button id="play" aria-label="play: pick where"><span class="emoji">👍</span></button>
  </div>
  <div id="picker" class="bar picker hidden">
    <div id="stage-list" class="stages" aria-label="pick a stage"></div>
    <div id="dial" class="keypad dial hidden" aria-label="pick a level"></div>
    <div class="menu">
      <button id="pick-bye" aria-label="wave bye, back"><span class="emoji">👋</span></button>
      <button id="pick-go" class="hidden" aria-label="play this level"><span class="emoji">▶️</span></button>
    </div>
  </div>
</footer>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
  }
}
</script>
<script type="module" src="lobby.js"></script>
</body>
</html>
